        <path d="M262 380 L300 430"></path>

        <circle cx="352" cy="300" r="6.5"></circle>

      <div style="position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px;">
        <span style="font-size: 14px; font-weight: 500; color: #9dc4ea;">فعال از</span>
        <span style="font-size: 44px; font-weight: 900; line-height: 1.05; color: #ffffff;">۱۳۸۲</span>

    <p style="margin: 0; font-size: 17px; line-height: 1.65; font-weight: 500; color: #cfe0f2;">

    </p>

    <span style="font-size: 19px; font-weight: 700; color: #e8861a;">سابقه و اعتبار داده نما ❯</span>
