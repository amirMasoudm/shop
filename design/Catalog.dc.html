<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700;900&display=swap">
  <style>
    body {
      margin: 0;
      font-family: 'Vazirmatn', Tahoma, 'Segoe UI', sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    a { color: #e8861a; text-decoration: none; }
    a:hover { color: #c96f0d; }
  </style>
</helmet>

<div dir="rtl" style="display: flex; width: 1440px; height: 411px; overflow: hidden; background: #f2f5fb;">

  <div style="flex-shrink: 0; width: 828px; height: 100%; padding: 0 72px; display: flex; flex-direction: column; justify-content: center; gap: 15px; border-radius: 20px 0 0 20px; background: linear-gradient(135deg, #16375f 0%, #1b4f8a 100%);">

    <div style="display: flex; align-items: center; gap: 10px;">
      <span style="display: block; width: 26px; height: 3px; border-radius: 2px; background: #e8861a;"></span>
      <span style="font-size: 16px; font-weight: 700; letter-spacing: 0.03em; color: #9dc4ea;">مرجعِ تخصصیِ شبکه و وایرلس</span>
    </div>

    <h1 style="margin: 0; font-size: 46px; line-height: 1.28; font-weight: 900; color: #ffffff; text-wrap: pretty;">
      کاتالوگِ کامل، با<br>ضمانتِ اصالتِ کالا
    </h1>

    <p style="margin: 0; font-size: 19px; line-height: 1.7; font-weight: 500; color: #cfe0f2; max-width: 560px;">
      روتر، سوییچ، رادیوی اوت‌دور، آنتن، اکسس‌پوینت و تلفنِ تحتِ شبکه — با مشخصاتِ فنیِ بازخوانی‌شده از منبعِ رسمیِ هر برند.
    </p>

    <span style="margin-top: 6px; font-size: 18px; font-weight: 700; color: #e8861a;">مشاهدهٔ محصولات ❯</span>
  </div>

  <div style="flex: 1; height: 100%; padding: 0 56px 0 72px; display: flex; flex-direction: column; justify-content: center; gap: 18px;">

    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px;">
      <div style="display: flex; align-items: center; justify-content: center; padding: 13px 8px; border: 1px solid #e0e8f2; border-radius: 12px; background: #ffffff; font-size: 17px; font-weight: 700; color: #1b4f8a;">میکروتیک</div>
      <div style="display: flex; align-items: center; justify-content: center; padding: 13px 8px; border: 1px solid #e0e8f2; border-radius: 12px; background: #ffffff; font-size: 17px; font-weight: 700; color: #1b4f8a;">یوبیکیوتی</div>
      <div style="display: flex; align-items: center; justify-content: center; padding: 13px 8px; border: 1px solid #e0e8f2; border-radius: 12px; background: #ffffff; font-size: 17px; font-weight: 700; color: #1b4f8a;">میموسا</div>
      <div style="display: flex; align-items: center; justify-content: center; padding: 13px 8px; border: 1px solid #e0e8f2; border-radius: 12px; background: #ffffff; font-size: 17px; font-weight: 700; color: #1b4f8a;">کمبیوم</div>
      <div style="display: flex; align-items: center; justify-content: center; padding: 13px 8px; border: 1px solid #e0e8f2; border-radius: 12px; background: #ffffff; font-size: 17px; font-weight: 700; color: #1b4f8a;">انجینیوس</div>
      <div style="display: flex; align-items: center; justify-content: center; padding: 13px 8px; border: 1px solid #e0e8f2; border-radius: 12px; background: #ffffff; font-size: 17px; font-weight: 700; color: #1b4f8a;">فنویل</div>
    </div>

    <div style="display: flex; align-items: center; gap: 9px; padding-right: 4px;">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#1b4f8a" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 3l7 3v5.5c0 4.3-2.9 8.2-7 9.5-4.1-1.3-7-5.2-7-9.5V6l7-3z"></path>
        <path d="M9.2 11.9l2 2 3.6-3.8"></path>
      </svg>
      <span style="font-size: 16px; font-weight: 700; color: #1a2235;">فروشنده‌ای با مجوزِ رسمیِ تجهیزاتِ رادیویی</span>
    </div>

  </div>
</div>
</x-dc>
</body>
</html>
