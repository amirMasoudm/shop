<helmet>

  <style>

      margin: 0;
      font-family: 'Vazirmatn', Tahoma, 'Segoe UI', sans-serif;

<div dir="rtl" style="position: relative; width: 600px; height: 450px; overflow: hidden; background: linear-gradient(140deg, #16375f 0%, #1b4f8a 100%);">

      <span style="display: block; width: 22px; height: 3px; border-radius: 2px; background: #e8861a;"></span>
      <span style="font-size: 15px; font-weight: 700; color: #9dc4ea;">مرجعِ تخصصیِ شبکه و وایرلس</span>
      <span style="display: block; width: 22px; height: 3px; border-radius: 2px; background: #e8861a;"></span>
    </div>

    <h1 style="margin: 0; font-size: 35px; line-height: 1.3; font-weight: 900; color: #ffffff; text-wrap: pretty;">
      کاتالوگِ کامل، با<br>ضمانتِ اصالتِ کالا
    </h1>

    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 9px; width: 100%;">
      <div style="display: flex; align-items: center; justify-content: center; padding: 10px 4px; border: 1px solid rgba(255,255,255,0.22); border-radius: 10px; background: rgba(255,255,255,0.08); font-size: 15px; font-weight: 700; color: #dbe8f6;">میکروتیک</div>

      <div style="display: flex; align-items: center; justify-content: center; padding: 10px 4px; border: 1px solid rgba(255,255,255,0.22); border-radius: 10px; background: rgba(255,255,255,0.08); font-size: 15px; font-weight: 700; color: #dbe8f6;">میموسا</div>
      <div style="display: flex; align-items: center; justify-content: center; padding: 10px 4px; border: 1px solid rgba(255,255,255,0.22); border-radius: 10px; background: rgba(255,255,255,0.08); font-size: 15px; font-weight: 700; color: #dbe8f6;">کمبیوم</div>

    </div>

    <span style="font-size: 19px; font-weight: 700; color: #e8861a;">مشاهدهٔ محصولات ❯</span>
  </div>
</div>
