# ===============================
# Server
# ===============================

server.port=8080

server.address=0.0.0.0
#??? ???? ??? ??? Nginx ?? Spring Boot ?????? ????? ????.

# ===============================
# Proxy HTTPS
# ===============================

server.forward-headers-strategy=framework


server.servlet.session.cookie.http-only=true

server.servlet.session.cookie.same-site=lax

server.servlet.session.cookie.secure=false


# ===============================
# Domain CORS
# ===============================

app.cors.allowed-origins=https://dadehnama.com


# ===============================
# Initial Admin PROD (حتماً در استقرار واقعی مقداردهی شوند)
# ===============================

app.admin.username=${ADMIN_USERNAME:superadmin}
app.admin.phone=${ADMIN_PHONE:}
app.admin.password=${ADMIN_PASSWORD:}


# ===============================
# MongoDB PROD
# ===============================

spring.data.mongodb.uri=${MONGO_URI}


# ===============================
# Upload PROD
# ===============================

app.upload.dir=${UPLOAD_DIR:/opt/shop/uploads}
#??? ??? VPS ??? ?? ????????:
#mkdir -p /opt/shop/uploads

spring.servlet.multipart.max-file-size=5MB

spring.servlet.multipart.max-request-size=20MB



# ===============================
# APIs
# ===============================

# آنالیتیکس (فاز ۰ رودمپ): خالی = غیرفعال
analytics.ga4.measurement-id=${GA4_ID:}
analytics.gsc.verification=${GSC_VERIFICATION:}


# SMS.ir — کلید فقط از متغیر محیطی خوانده می‌شود (اگر تنظیم نشود اپ بالا می‌آید ولی سرویس پیامک غیرفعال است)
sms.api-key=${SMS_API_KEY:}
sms.template-id=${SMS_TEMPLATE_ID:638829}
sms.url=${SMS_URL:https://api.sms.ir/v1/send/verify}


openai.api.key=${OPENAI_KEY}

openai.api.base=https://api.openai.com/v1

openai.model=gpt-4o-mini


shipping.tapin.api-url=https://public.api.tapin.ir/api/v1/post-office/check-price/

shipping.tapin.token=${TAPIN_TOKEN}


shipping.snappbox.api-url=https://api.snapp.box/v1/public/price

shipping.snappbox.token=${SNAPP_TOKEN}



# ===============================
# Logging PROD
# ===============================

logging.level.org.springframework=INFO

logging.level.org.springframework.security=WARN

logging.level.org.example=INFO