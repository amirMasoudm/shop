# ===============================
# Server
# ===============================

server.port=8080

server.address=0.0.0.0
#??? ???? ??? ??? Nginx ?? Spring Boot ?????? ????? ????.

# ===============================
# Proxy HTTPS
# ===============================

server.forward-headers-strategy=framework


server.servlet.session.cookie.http-only=true

server.servlet.session.cookie.same-site=lax

# سایت از ۱۷ سپتامبر HTTPS است؛ false از دورهٔ HTTP مانده بود.
# ⚠️ داکرِ لوکال هم پروفایلِ prod را اجرا می‌کند ولی روی HTTP؛ کامپوزِ لوکال
# SESSION_COOKIE_SECURE=false می‌دهد. کامپوزِ سرور نمی‌دهد، پس آن‌جا true است.
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:true}


# ===============================
# Domain CORS
# ===============================

app.cors.allowed-origins=https://dadehnama.com
app.app-api.allowed-origins=https://appassets.androidplatform.net,https://dadehnama.com,https://www.dadehnama.com


# ===============================
# Initial Admin PROD (حتماً در استقرار واقعی مقداردهی شوند)
# ===============================

app.admin.username=${ADMIN_USERNAME:superadmin}
app.admin.phone=${ADMIN_PHONE:}
app.admin.password=${ADMIN_PASSWORD:}


# ===============================
# MongoDB PROD
# ===============================

spring.data.mongodb.uri=${MONGO_URI}


# ===============================
# Upload PROD
# ===============================

app.upload.dir=${UPLOAD_DIR:/opt/shop/uploads}
#??? ??? VPS ??? ?? ????????:
#mkdir -p /opt/shop/uploads

# ===============================
# ضمیمه‌هایِ چتِ پشتیبانی — عمداً جدا از پوشهٔ آپلودِ عمومی
# ===============================
# 🔴 این مسیر نباید هرگز توسطِ nginx یا ResourceHandler سرو شود. ضمیمهٔ چت فایلِ
#    خصوصیِ یک مشتری است و فقط از /api/v1/chat/attachments/{id} با چکِ عضویت
#    تحویل می‌شود. دیفالت دارد تا نبودنش در composeِ سرور باعثِ بالا نیامدنِ اپ نشود.
app.chat.dir=${CHAT_DIR:/opt/shop/chat}

# ۱۵ مگابایت تا عکسِ گوشی به کدِ فشرده‌سازی برسد؛ سقفِ واقعیِ ذخیره در
# ChatAttachmentService و FileStorageService اعمال می‌شود، نه اینجا.
spring.servlet.multipart.max-file-size=15MB

spring.servlet.multipart.max-request-size=25MB



# ===============================
# APIs
# ===============================

