# ===============================
# Application
# ===============================

spring.application.name=shop1

# Profile ???????
# ??? ???? ???? ????? ???? ????? ???? ??????
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# ایندکس‌های مونگو عمداً خودکار ساخته نمی‌شوند. انوتیشن‌های @Indexed روی User فقط
# توصیفی‌اند و ساختِ واقعی با MongoIndexInitializer انجام می‌شود — چون آن اول دنبالِ
# داده‌ی تکراری می‌گردد و به‌جای بالا نیامدنِ برنامه با استک‌تریسِ نامفهوم، خطای روشن
# لاگ می‌کند. این را true نکن: با MongoIndexInitializer ریس می‌شود.
spring.data.mongodb.auto-index-creation=false

# ===============================
# Session (تسک ۱۲): سشنِ ادمین در MongoDB تا ری‌استارتِ داکر/لپ‌تاپ را رد کند
# ===============================
# محلِ ذخیره: MongoDB (پایدار در ری‌استارت) به‌جای RAM
spring.session.store-type=mongodb
spring.session.mongodb.collection-name=sessions
# عمرِ سشن و کوکیِ ماندگار — ۳۰ روز (TTL indexِ مونگو خودکار ساخته می‌شود)
server.servlet.session.timeout=30d
server.servlet.session.cookie.max-age=30d
# ===============================
# ردگیریِ رفتارِ کاربر (فازِ ۱)
# ===============================
# ⚠️ همهٔ این کلیدها همین‌جا مقدارِ پیش‌فرض دارند، پس کامپوزِ سرور برایِ این فیچر
#    نیازی به تغییر ندارد. فقط دو تا متغیرِ محیطیِ اختیاری دارند و هر دو پیش‌فرضِ
#    امن دارند: ANALYTICS_RETENTION_DAYS و ANALYTICS_ARCHIVE_DIR.

# مدتِ نگه‌داریِ دادهٔ خام. فازِ ۲ (آرشیو-سپس-حذف) از همین می‌خواند.
# 🔴 ایندکسِ TTL عمداً ساخته نمی‌شود: TTL بی‌صدا و بی‌قید حذف می‌کند و نمی‌شود شرطِ
#    «فقط اگر آرشیو گرفته شده» را به آن داد. حذف کارِ جابِ خودمان در فازِ ۲ است.
# روی سرور با متغیرِ ANALYTICS_RETENTION_DAYS قابلِ تغییر است، بی‌آنکه لازم باشد
# jar از نو ساخته شود. برای دیدنِ یک چرخهٔ کاملِ آرشیو اصلاً دست به این نزن —
# در تبِ «داده و آرشیو» دکمهٔ «اجرای آرشیو با آستانهٔ دلخواه» همین کار را یک‌باره می‌کند.
app.analytics.retention-days=${ANALYTICS_RETENTION_DAYS:90}

# صفِ نوشتن — کرانِ بالا دارد تا روی سرورِ دوهسته‌ای رشدِ آزاد نکند
app.analytics.queue-capacity=10000
app.analytics.flush-batch-size=500

app.analytics.session-minutes=30
app.analytics.anon-cookie-days=365

# جدولِ دامنه‌ها — عمداً تنظیمات است نه کد. دانشِ کسب‌وکارِ یک فروشگاهِ مشخص است،
# پس در هستهٔ اپ هاردکد نمی‌شود و هر نصبِ دیگری فهرستِ خودش را می‌گذارد.
app.analytics.search-hosts=google.com,google.co,bing.com,yandex.com,yandex.ru,duckduckgo.com,search.marefa.ir
app.analytics.social-hosts=instagram.com,t.me,telegram.me,telegram.org,linkedin.com,x.com,twitter.com,aparat.com,facebook.com,whatsapp.com
# ترب عمداً جداست: فیدش هزینهٔ مستقیم دارد و اگر داخلِ «ارجاع» گم شود هیچ‌وقت
# نمی‌فهمیم چقدر می‌فروشد.
app.analytics.marketplace-hosts=torob.com,emalls.ir,basalam.com,digikala.com
app.analytics.paid-mediums=cpc,ppc,paid,paidsearch

# فایلِ CSVِ ژئو برایِ شهر. خالی = شهر ثبت نمی‌شود (بقیهٔ ردگیری کار می‌کند).
# ستون‌ها: ip_from,ip_to,country_code,country_name,region,city — قالبِ IP2Location LITE.
app.analytics.geo-csv=

app.analytics.max-prop-keys=10
app.analytics.max-prop-bytes=500
app.analytics.beacon-max-events=20
app.analytics.beacon-max-bytes=8192
app.analytics.rate-limit-per-minute=120

# --- فازِ ۲: جمع‌بندی و آرشیو ---
# مرزِ «یک روز» در جمع‌بندی. خالی = زمانِ سرور.
app.analytics.zone=Asia/Tehran
# 🔴 بیرونِ /uploads/ و بیرونِ هر مسیری که سرو می‌شود؛ این فایل‌ها تاریخچهٔ رفتارِ
#    مشتریانِ واقعی‌اند و فقط از کنترلرِ ADMIN تحویل می‌شوند.
app.analytics.archive-dir=${ANALYTICS_ARCHIVE_DIR:/opt/shop/analytics-archive}
app.analytics.archive-warn-mb=2048
