# ===============================
# Application
# ===============================

spring.application.name=shop1

# Profile ???????
# ??? ???? ???? ????? ???? ????? ???? ??????
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# ایندکس‌های مونگو عمداً خودکار ساخته نمی‌شوند. انوتیشن‌های @Indexed روی User فقط
# توصیفی‌اند و ساختِ واقعی با MongoIndexInitializer انجام می‌شود — چون آن اول دنبالِ
# داده‌ی تکراری می‌گردد و به‌جای بالا نیامدنِ برنامه با استک‌تریسِ نامفهوم، خطای روشن
# لاگ می‌کند. این را true نکن: با MongoIndexInitializer ریس می‌شود.
spring.data.mongodb.auto-index-creation=false

# ===============================
# Session (تسک ۱۲): سشنِ ادمین در MongoDB تا ری‌استارتِ داکر/لپ‌تاپ را رد کند
# ===============================
# محلِ ذخیره: MongoDB (پایدار در ری‌استارت) به‌جای RAM
spring.session.store-type=mongodb
spring.session.mongodb.collection-name=sessions
# عمرِ سشن و کوکیِ ماندگار — ۳۰ روز (TTL indexِ مونگو خودکار ساخته می‌شود)
server.servlet.session.timeout=30d
server.servlet.session.cookie.max-age=30d