<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>فروشگاه ابزار رضا</title>
    <style>
        :root {
            --primary-color: #d32f2f;
            --text-color: #333;
            --bg-color: #fff;
            --hover-bg: #f5f5f5;
            --border-color: #ddd;
            --shadow: 0 4px 12px rgba(0,0,0,0.15);
        }

        body { font-family: 'Segoe UI', Tahoma, sans-serif; margin: 0; background-color: #f4f4f6; }
        a { text-decoration: none; color: inherit; }
        ul { list-style: none; padding: 0; margin: 0; }

        .header { background: var(--bg-color); border-bottom: 2px solid var(--primary-color); position: sticky; top: 0; z-index: 1000; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .navbar { max-width: 1400px; margin: 0 auto; height: 55px; display: flex; justify-content: space-between; align-items: center; padding: 0 15px; }
        .menu-root { display: flex; align-items: center; height: 100%; }
        .menu-item { position: relative; cursor: pointer; }
        .menu-link { display: flex; justify-content: space-between; align-items: center; padding: 0 20px; white-space: nowrap; font-size: 14px; color: var(--text-color); transition: 0.2s; height: 100%; }
        .menu-root > .menu-item:hover > .menu-link { background-color: var(--primary-color); color: #fff; }

        .submenu { position: absolute; background-color: var(--bg-color); border: 1px solid var(--border-color); box-shadow: var(--shadow); min-width: 220px; display: none; z-index: 999; }
        .menu-root > .menu-item > .submenu { top: 100%; right: 0; }
        .submenu .submenu { top: -1px; right: 100%; }
        .menu-item:hover > .submenu { display: block; animation: fadeIn 0.2s ease-in-out; }
        .submenu .menu-link { padding: 12px 15px; border-bottom: 1px solid #f0f0f0; }
        .arrow { font-size: 10px; margin-right: 10px; opacity: 0.6; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }

        .page-header { max-width: 1400px; margin: 20px auto; padding: 0 20px; display: flex; justify-content: space-between; align-items: center; }
        .products-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 20px; padding: 0 20px 40px; max-width: 1400px; margin: 0 auto; }

        .product-card { background: #fff; border: 1px solid #e0e0e2; border-radius: 8px; overflow: hidden; position: relative; transition: 0.3s; display: flex; flex-direction: column; height: 430px; }
        .product-card:hover { box-shadow: 0 12px 24px rgba(0,0,0,0.12); transform: translateY(-5px); }

        .card-image-wrapper { height: 220px; padding: 15px; display: flex; align-items: center; justify-content: center; background-color: #fff; }
        .card-image { max-width: 100%; max-height: 100%; object-fit: contain; }

        .discount-badge { position: absolute; top: 10px; right: 10px; background-color: var(--primary-color); color: #fff; font-size: 12px; font-weight: bold; padding: 4px 8px; border-radius: 4px; z-index: 2; }

        .card-content { padding: 15px; flex-grow: 1; display: flex; flex-direction: column; }
        .product-title { font-size: 14px; font-weight: 600; color: #333; height: 42px; overflow: hidden; margin-bottom: 10px; line-height: 1.5; }

        .price-section { margin-top: auto; }
        .old-price { font-size: 13px; color: #999; text-decoration: line-through; display: block; height: 20px; }
        .current-price { font-size: 18px; font-weight: 800; color: #000; }

        .add-to-cart-btn { width: 100%; padding: 12px; background-color: var(--primary-color); color: white; border: none; font-weight: bold; cursor: pointer; transition: 0.2s; position: absolute; bottom: 0; transform: translateY(100%); opacity: 0; }
        .product-card:hover .add-to-cart-btn { transform: translateY(0); opacity: 1; }
        .product-card:hover .card-content { padding-bottom: 50px; }

        .loading, .no-data { grid-column: 1/-1; text-align: center; padding: 50px; color: #666; }

        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); display: flex; justify-content: center; align-items: center; z-index: 1000; }
        .modal-content { background: white; padding: 30px; border-radius: 12px; width: 320px; animation: slideIn 0.3s ease-out; text-align: center; }
        @keyframes slideIn { from { transform: translateY(-20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        .hidden { display: none !important; }
        input { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ccc; border-radius: 8px; text-align: center; font-size: 1rem; }
        button { width: 100%; padding: 12px; background: #007bff; color: white; border: none; border-radius: 8px; cursor: pointer; font-size: 1rem; transition: 0.3s; margin-top: 10px; }
        button:hover { background: #0056b3; }
        #msg { margin-top: 15px; font-size: 0.85rem; min-height: 20px; }
        .auth-section { padding: 0 20px; font-size: 14px; color: var(--text-color); cursor: pointer; display: flex; align-items: center; }
        .auth-section:hover { color: var(--primary-color); }
        .logout-btn { margin-right: 10px; background: none; border: none; color: #d32f2f; cursor: pointer; font-size: 14px; }
    </style>
</head>
<body>

<header class="header">
    <nav class="navbar" id="navbar-container">
        <!-- منو و دکمه ورود اینجا اضافه میشه -->
    </nav>
</header>

<div class="page-header">
    <h2 id="category-title">همه محصولات</h2>
</div>

<main class="products-grid" id="products-grid">
    <div class="loading">در حال دریافت محصولات...</div>
</main>

<!-- مودال ورود / ثبت‌نام -->
<div id="modal-auth" class="modal-overlay hidden">
    <div class="modal-content">
        <h2 id="auth-title">خوش آمدید</h2>

        <div id="step-phone">
            <p>شماره موبایل خود را وارد کنید</p>
            <input type="text" id="phone" placeholder="09123456789" maxlength="11">
            <button onclick="sendOtp()">ارسال کد تایید</button>
        </div>

        <div id="step-otp" class="hidden">
            <p>کد ۵ رقمی را وارد کنید</p>
            <input type="text" id="otp" placeholder="-----" maxlength="5">
            <button onclick="verifyOtp()">تایید کد</button>
            <button style="background:none; color:#777;" onclick="resetToPhoneStep()">اصلاح شماره</button>
        </div>

        <div id="step-profile" class="hidden">
            <h3>تکمیل پروفایل</h3>
            <p>لطفاً نام خود را وارد کنید</p>
            <input type="text" id="fName" placeholder="نام">
            <input type="text" id="lName" placeholder="نام خانوادگی">
            <button onclick="saveProfile()">ثبت و ورود نهایی</button>
        </div>

        <div id="msg"></div>
    </div>
</div>

<script>
    const BASE_URL = 'http://localhost:8080';
    const API_CATEGORIES = `${BASE_URL}/api/categories/tree`;
    const API_PRODUCTS = `${BASE_URL}/api/v1/products`;

    const navbarContainer = document.getElementById('navbar-container');
    const productsGrid = document.getElementById('products-grid');
    const categoryTitleLabel = document.getElementById('category-title');
    const authModal = document.getElementById('modal-auth');

    let userPhone = "";
    let userData = null;
    let menuRendered = false; // جلوگیری از رندر چندباره منو
    let authSection = null;   // دکمه ورود/سلام

    // ایجاد دکمه ورود/ثبت‌نام
    function createAuthSection() {
        if (authSection) return; // اگر قبلاً ساخته شده، دوباره نساز

        authSection = document.createElement('div');
        authSection.className = 'auth-section';
        authSection.innerText = 'ورود / ثبت‌نام';
        authSection.onclick = openAuthModal;
        navbarContainer.appendChild(authSection);
    }

    // دریافت و نمایش منو (فقط یک بار)
    async function initMenu() {
        if (menuRendered) return; // جلوگیری از اجرای چندباره

        try {
            const response = await fetch(API_CATEGORIES);
            if (!response.ok) throw new Error('دریافت دسته‌بندی‌ها شکست خورد');

            const data = await response.json();
            renderMenu(data);
            menuRendered = true;
            createAuthSection();
            checkLoggedIn();
        } catch (error) {
            console.error('خطا در دریافت منو:', error);
            navbarContainer.innerHTML = '<div style="color:red; padding:15px;">خطا در بارگذاری منو</div>';
        }
    }

    function renderMenu(categories) {
        const rootUl = document.createElement('ul');
        rootUl.classList.add('menu-root');

        categories.forEach(item => {
            const li = document.createElement('li');
            li.className = 'menu-item';

            const a = document.createElement('a');
            a.className = 'menu-link';
            a.href = '#';
            a.innerHTML = `<span>${item.name}</span>`;
            a.onclick = (e) => {
                e.preventDefault();
                loadProducts(item.id, item.name);
            };

            if (item.children && item.children.length > 0) {
                a.innerHTML += `<span class="arrow">&#9664;</span>`;
                li.appendChild(a);
                li.appendChild(createSubmenu(item.children));
            } else {
                li.appendChild(a);
            }

            rootUl.appendChild(li);
        });

        navbarContainer.prepend(rootUl); // منو سمت چپ
    }

    function createSubmenu(items) {
        const ul = document.createElement('ul');
        ul.className = 'submenu';

        items.forEach(item => {
            const li = document.createElement('li');
            li.className = 'menu-item';

            const a = document.createElement('a');
            a.className = 'menu-link';
            a.href = '#';
            a.innerHTML = `<span>${item.name}</span>`;
            a.onclick = (e) => {
                e.preventDefault();
                loadProducts(item.id, item.name);
            };

            if (item.children && item.children.length > 0) {
                a.innerHTML += `<span class="arrow">&#9664;</span>`;
                li.appendChild(a);
                li.appendChild(createSubmenu(item.children));
            } else {
                li.appendChild(a);
            }

            ul.appendChild(li);
        });

        return ul;
    }

    // دریافت محصولات
    async function loadProducts(categoryId = '', categoryName = 'همه محصولات') {
        productsGrid.innerHTML = '<div class="loading">در حال بارگذاری...</div>';
        categoryTitleLabel.textContent = categoryName;

        try {
            const url = categoryId ? `${API_PRODUCTS}?categoryId=${categoryId}` : API_PRODUCTS;
            const response = await fetch(url);
            if (!response.ok) throw new Error('دریافت محصولات شکست خورد');

            const pageData = await response.json();
            const products = pageData.content || [];
            renderProductGrid(products);
        } catch (error) {
            console.error('خطا در دریافت محصولات:', error);
            productsGrid.innerHTML = '<div class="no-data">خطا در دریافت محصولات</div>';
        }
    }

    // رندر محصولات با lazy loading تصاویر
    function renderProductGrid(products) {
        if (products.length === 0) {
            productsGrid.innerHTML = '<div class="no-data">هیچ محصولی یافت نشد.</div>';
            return;
        }

        productsGrid.innerHTML = products.map(p => {
            let finalPrice = p.price;
            let oldPriceDisplay = '';
            let discountBadge = '';

            if (p.discountPercent && p.discountPercent > 0) {
                finalPrice = p.price - (p.price * p.discountPercent / 100);
                oldPriceDisplay = `<span class="old-price">${p.price.toLocaleString()} تومان</span>`;
                discountBadge = `<span class="discount-badge">${p.discountPercent}٪ تخفیف</span>`;
            }

            const hasImage = p.images && p.images.length > 0;
            const imageUrl = hasImage ? `http://localhost:8080/uploads/${p.images[0]}` : 'https://via.placeholder.com/300x220?text=No+Image';

            return `
                <div class="product-card">
                    ${discountBadge}
                    <div class="card-image-wrapper">
                        <img
                            src="https://via.placeholder.com/300x220?text=در+حال+بارگذاری..."
                            data-src="${imageUrl}"
                            class="card-image lazy"
                            alt="${p.name}"
                        >
                    </div>
                    <div class="card-content">
                        <h3 class="product-title">${p.name}</h3>
                        <div class="price-section">
                            ${oldPriceDisplay}
                            <div class="current-price">${Math.round(finalPrice).toLocaleString()} <small style="font-size:12px">تومان</small></div>
                        </div>
                    </div>
                    <button class="add-to-cart-btn" onclick="addToCart('${p.id}')">افزودن به سبد خرید</button>
                </div>
            `;
        }).join('');

        // Lazy loading تصاویر
        lazyLoadImages();
    }

    function lazyLoadImages() {
        const lazyImages = document.querySelectorAll('img.lazy');
        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    const img = entry.target;
                    img.src = img.dataset.src;
                    img.classList.remove('lazy');
                    observer.unobserve(img);
                }
            });
        }, { rootMargin: '50px' });

        lazyImages.forEach(img => observer.observe(img));
    }

    function addToCart(id) {
        alert("محصول با کد " + id + " به سبد اضافه شد.");
    }

    // ==== منطق ورود و ثبت‌نام ====
    function openAuthModal() {
        authModal.classList.remove('hidden');
        resetAuthSteps();
    }

    function closeAuthModal() {
        authModal.classList.add('hidden');
    }

    function resetAuthSteps() {
        document.getElementById('step-phone').classList.remove('hidden');
        document.getElementById('step-otp').classList.add('hidden');
        document.getElementById('step-profile').classList.add('hidden');
        document.getElementById('auth-title').innerText = "خوش آمدید";
        document.getElementById('msg').innerText = '';
        document.getElementById('phone').value = '';
        document.getElementById('otp').value = '';
        document.getElementById('fName').value = '';
        document.getElementById('lName').value = '';
    }

    function resetToPhoneStep() {
        document.getElementById('step-otp').classList.add('hidden');
        document.getElementById('step-phone').classList.remove('hidden');
        document.getElementById('auth-title').innerText = "خوش آمدید";
        document.getElementById('msg').innerText = '';
    }

    function showMsg(text, color) {
        const msg = document.getElementById('msg');
        msg.innerText = text;
        msg.style.color = color;
    }

    async function sendOtp() {
        const phone = document.getElementById('phone').value;
        if (!/^09\d{9}$/.test(phone)) {
            showMsg("شماره موبایل معتبر نیست", "red");
            return;
        }

        try {
            const res = await fetch(`${BASE_URL}/api/auth/send-otp`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ phoneNumber: phone })
            });

            if (res.ok) {
                userPhone = phone;
                document.getElementById('step-phone').classList.add('hidden');
                document.getElementById('step-otp').classList.remove('hidden');
                document.getElementById('auth-title').innerText = "تایید هویت";
                showMsg("کد با موفقیت ارسال شد", "green");
            } else {
                showMsg("خطا در ارسال کد", "red");
            }
        } catch (e) {
            showMsg("خطای شبکه", "red");
        }
    }

    async function verifyOtp() {
        const code = document.getElementById('otp').value.trim();
        if (code.length !== 5) return;

        try {
            const res = await fetch(`${BASE_URL}/api/auth/verify-otp`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ phoneNumber: userPhone, code })
            });

            if (res.ok) {
                const data = await res.json();
                localStorage.setItem('token', data.token || 'dummy');
                userData = data.user || {};
                const isProfileComplete = data.isProfileComplete !== false;

                if (!isProfileComplete) {
                    document.getElementById('step-otp').classList.add('hidden');
                    document.getElementById('step-profile').classList.remove('hidden');
                } else {
                    finalizeLogin();
                }
            } else {
                showMsg("کد وارد شده اشتباه است", "red");
            }
        } catch (e) {
            showMsg("خطا در ارتباط با سرور", "red");
        }
    }

    async function saveProfile() {
        const firstName = document.getElementById('fName').value.trim();
        const lastName = document.getElementById('lName').value.trim();

        if (!firstName || !lastName) {
            alert("نام و نام خانوادگی را وارد کنید");
            return;
        }

        try {
            const res = await fetch(`${BASE_URL}/api/auth/complete-profile`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ phoneNumber: userPhone, firstName, lastName })
            });

            if (res.ok) {
                let data;
                try {
                    data = await res.json();
                } catch {
                    data = {}; // اگر JSON خالی بود، ادامه بده
                }
                localStorage.setItem('token', data.token || 'dummy');
                userData = data.user || { firstName, lastName, role: 'USER' }; // فرض role پیش‌فرض اگر نباشه
                finalizeLogin();
            } else {
                alert("خطا در ثبت اطلاعات");
            }
        } catch (e) {
            alert("خطای ارتباط با سرور");
        }
    }

    function finalizeLogin() {
        const fullName = `${userData.firstName || ''} ${userData.lastName || ''}`.trim();
        localStorage.setItem('userName', fullName);
        localStorage.setItem('userRole', userData.role || 'USER');

        closeAuthModal();

        // ریدایرکت بر اساس role
        const role = localStorage.getItem('userRole');
        if (role === 'ADMIN') {
            window.location.href = '/Admin.html';
        } else {
            window.location.href = '/customerPanel.html';
        }
    }

    function logout() {
        localStorage.removeItem('token');
        localStorage.removeItem('userName');
        localStorage.removeItem('userRole');
        userData = null;

        if (authSection) {
            authSection.innerHTML = 'ورود / ثبت‌نام';
            authSection.onclick = openAuthModal;
        }

        // بعد از خروج، منو و محصولات دوباره بدون توکن لود میشن (عمومی)
        initMenu();
        loadProducts();
    }

    function checkLoggedIn() {
        const storedName = localStorage.getItem('userName');
        if (storedName && authSection) {
            authSection.innerHTML = `سلام ${storedName} <button class="logout-btn">خروج</button>`;
            authSection.onclick = null;
            authSection.querySelector('.logout-btn').onclick = logout;
        }
    }

    // بستن مودال با کلیک بیرون
    authModal.addEventListener('click', (e) => {
        if (e.target === authModal) closeAuthModal();
    });

    // شروع برنامه
    document.addEventListener('DOMContentLoaded', () => {
        initMenu();
        loadProducts();
    });
</script>

</body>
</html>
