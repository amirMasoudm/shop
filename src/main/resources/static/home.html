    <!DOCTYPE html>
    <html lang="fa">
    <head>
        <meta charset="UTF-8">
        <title>خانه</title>
        <style>
            body {
                direction: rtl;
                font-family: sans-serif;
                text-align: center;
                margin-top: 80px;
                background-color: #f9f9f9;
            }
            h2 {
                color: #333;
            }
            #info {
                margin-top: 20px;
                font-size: 18px;
                color: #555;
            }
            button {
                margin-top: 30px;
                padding: 10px 20px;
                background-color: #d9534f;
                color: white;
                border: none;
                border-radius: 8px;
                cursor: pointer;
            }
            button:hover {
                background-color: #c9302c;
            }
        </style>
    </head>
    <body>
    <h2>🎉 خوش آمدید</h2>

    <div id="info">در حال بارگذاری اطلاعات کاربر...</div>

    <form method="post" action="/logout">
        <button type="submit">خروج از حساب</button>
    </form>

    <script>
        async function loadUser() {
            try {
                const res = await fetch("/users/api/current-user");
                const user = await res.json();
                document.getElementById("info").innerHTML =
                    `👤 کاربر: <b>${user.username}</b> <br> 🧩 نقش‌ها: <b>${user.roles.join(', ')}</b>`;
            } catch (e) {
                document.getElementById("info").textContent = "خطا در دریافت اطلاعات کاربر!";
            }
        }
        loadUser();
    </script>
    </body>
    </html>
