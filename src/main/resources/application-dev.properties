# ===============================
# Server
# ===============================

server.port=8080
server.address=0.0.0.0


# ===============================
# Proxy / Cookies
# ===============================

server.forward-headers-strategy=framework

server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

server.servlet.session.cookie.secure=false


# ===============================
# CORS DEV
# ===============================

app.cors.allowed-origins=http://localhost:5173,http://localhost:63342,http://localhost:8080


# ===============================
# MongoDB DEV
# ===============================

spring.data.mongodb.uri=mongodb://localhost:27017/masoud


# ===============================
# File Upload DEV
# ===============================

app.upload.dir=C:/myproject_uploads


spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=20MB


# ===============================
# External APIs
# ===============================

# آنالیتیکس (فاز ۰ رودمپ): خالی = غیرفعال
analytics.ga4.measurement-id=${GA4_ID:}
analytics.gsc.verification=${GSC_VERIFICATION:}


# SMS.ir — کلید را از متغیر محیطی SMS_API_KEY بخوان (در سورس هاردکد نکن)
sms.api-key=${SMS_API_KEY:}
sms.template-id=${SMS_TEMPLATE_ID:638829}
# قالبِ «دوباره موجود شد» (متغیرِ PRODUCT) — جدا از قالبِ OTP
sms.stock-template-id=${SMS_STOCK_TEMPLATE_ID:791445}
sms.url=${SMS_URL:https://api.sms.ir/v1/send/verify}


openai.api.key=${OPENAI_KEY:}

openai.api.base=https://api.openai.com/v1

openai.model=gpt-4o-mini


shipping.tapin.api-url=https://public.api.tapin.ir/api/v1/post-office/check-price/

shipping.tapin.token=${TAPIN_TOKEN:}


shipping.snappbox.api-url=https://api.snapp.box/v1/public/price

shipping.snappbox.token=${SNAPP_TOKEN:}


# ===============================
# درگاهِ پرداختِ ملت — دیفالتِ خالی تا لوکال بدونِ این مقادیر هم بالا بیاید
# (فقط فیچرِ پرداخت غیرفعال می‌ماند، طبقِ الگویِ TAPIN_TOKEN/OPENAI_KEY)
# ===============================

mellat.terminal-id=${MELLAT_TERMINAL_ID:}
mellat.username=${MELLAT_USERNAME:}
mellat.password=${MELLAT_PASSWORD:}
mellat.gateway-url=${MELLAT_GATEWAY_URL:https://bpm.shaparak.ir/pgwchannel/services/pgw}


# ===============================
# Logging DEV
# ===============================

logging.level.org.springframework=INFO
logging.level.org.example=DEBUG
logging.level.org.springframework.security=DEBUG

# ===============================
# Torob Product API v3
# ===============================
# کلیدِ عمومیِ ترب (ed25519) از مستنداتِ رسمی — عمومی است، رمز نیست.
# اینجاست تا اگر ترب کلید را چرخاند، فقط env عوض شود و نیازی به ری‌بیلد نباشد.
torob.public-key=${TOROB_PUBLIC_KEY:MCowBQYDK2VwAyEAt6Mu4T0pBORY11W+QeM35UsmLO3vsf+6yKpFDEImFk0=}
