<!DOCTYPE html>
<html lang="fa" dir="rtl" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <link rel="icon" href="/favicon.ico" sizes="any">
    <link rel="icon" type="image/png" sizes="192x192" href="/img/icon-192.png">
    <link rel="apple-touch-icon" href="/img/apple-touch-icon.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${seoTitle}">مقاله | داده نما</title>
    <meta name="description" th:content="${seoDescription}">
    <link rel="canonical" th:href="${canonicalUrl}">
    <meta property="og:title" th:content="${seoTitle}">
    <meta property="og:description" th:content="${seoDescription}">
    <meta property="og:type" content="article">
    <meta property="og:url" th:content="${canonicalUrl}">
    <meta property="og:image" th:content="${ogImage}">
    <meta name="google-site-verification" th:if="${gscToken != null and gscToken != ''}" th:content="${gscToken}">

    <!-- اسکیمای Article (سروری) -->
    <script type="application/ld+json" th:if="${articleJsonLd != null}" th:utext="${articleJsonLd}"></script>

    <th:block th:if="${ga4Id != null and ga4Id != ''}">
        <script async th:src="'https://www.googletagmanager.com/gtag/js?id=' + ${ga4Id}"></script>
        <script th:inline="javascript">
            window.dataLayer = window.dataLayer || [];
            function gtag(){dataLayer.push(arguments);}
            gtag('js', new Date());
            gtag('config', [[${ga4Id}]]);
        </script>
    </th:block>

    <link href="/css/fonts/Vazirmatn-font-face.css" rel="stylesheet">
    <link href="/css/site-nav.css" rel="stylesheet">
    <style>
        :root { --primary:#1b4f8a; --accent:#e8861a; --text:#1f2937; --mid:#6b7280; --bg:#f6f8fb; }
        * { box-sizing:border-box; margin:0; }
        body { font-family:Vazirmatn, Tahoma, sans-serif; background:var(--bg); color:var(--text); }
        .topbar { background:var(--primary); color:#fff; padding:14px 16px; }
        .topbar .in { max-width:860px; margin:0 auto; display:flex; justify-content:space-between; align-items:center; }
        .topbar a { color:#fff; text-decoration:none; font-weight:700; }
        main { max-width:860px; margin:0 auto; padding:28px 16px; }
        .crumb { font-size:.8rem; color:var(--mid); margin-bottom:16px; }
        .crumb a { color:var(--primary); text-decoration:none; }
        article { background:#fff; border:1px solid #e5e7eb; border-radius:16px; padding:28px; }
        h1 { font-size:1.6rem; line-height:1.7; margin-bottom:10px; }
        .meta { color:var(--mid); font-size:.8rem; margin-bottom:20px; }
        .cover { width:100%; max-height:420px; aspect-ratio:21/9; object-fit:cover; border-radius:12px; margin-bottom:24px; }
        .content { line-height:2.1; font-size:1rem; }
        .content h2 { font-size:1.25rem; margin:28px 0 12px; border-right:4px solid var(--accent); padding-right:10px; }
        .content h3 { font-size:1.1rem; margin:22px 0 10px; }
        .content p { margin-bottom:14px; }
        .content ul, .content ol { margin:0 20px 14px 0; }
        .content li { margin-bottom:6px; }
        .content img { max-width:100%; height:auto; border-radius:10px; margin:12px 0; }
        .content table { width:100%; border-collapse:collapse; margin:16px 0; font-size:.9rem; }
        .content th, .content td { border:1px solid #e5e7eb; padding:10px; text-align:right; }
        .content th { background:#f2f5fb; }
        .content a { color:var(--primary); }
        .content pre, .content code { background:#f3f4f6; border-radius:6px; padding:2px 6px; direction:ltr; display:inline-block; }
        .cta { margin-top:28px; background:#f2f5fb; border:1px solid #dbe4f0; border-radius:12px; padding:18px; text-align:center; }
        .cta a { display:inline-block; margin-top:10px; background:var(--accent); color:#fff; padding:10px 26px; border-radius:100px; text-decoration:none; font-weight:700; font-size:.9rem; }
        footer { background:#1b2a3a; color:#cbd5e1; padding:28px 16px; margin-top:44px; }
        footer .in { max-width:860px; margin:0 auto; }
        footer nav { display:flex; flex-wrap:wrap; gap:8px 16px; margin-top:10px; }
        footer a { color:#cbd5e1; text-decoration:none; font-size:.8rem; }
    </style>
</head>
<body>

<header class="topnav">
    <a class="brand" href="/">داده نما</a>
    <nav>
        <a href="/wimaxnear">WimaxNear</a>
        <a href="/shop">فروشگاه</a>
        <a href="/learn">آموزش</a>
        <a href="/blog" class="active">بلاگ</a>
    </nav>
    <div class="spacer"></div>
</header>

<header class="topbar">
    <div class="in">
        <a th:href="${baseUrl + '/shop'}">🛒 فروشگاه داده نما</a>
        <a th:href="${baseUrl + '/blog'}" style="font-size:.85rem;">بلاگ آموزشی</a>
    </div>
</header>

<main>
    <nav class="crumb">
        <a th:href="${baseUrl + '/shop'}">خانه</a> /
        <a th:href="${baseUrl + '/blog'}">بلاگ</a> /
        <span th:text="${article.title}">مقاله</span>
    </nav>

    <article>
        <h1 th:text="${article.title}">عنوان مقاله</h1>
        <div class="meta">
            آخرین به‌روزرسانی:
            <span th:text="${#temporals.format(article.updatedAt, 'yyyy/MM/dd')}">۱۴۰۵</span>
        </div>
        <img class="cover" th:if="${article.coverImage != null and !article.coverImage.isEmpty()}"
             th:src="${article.coverImage}" th:alt="${article.title}" decoding="async">

        <!-- محتوای HTML مقاله (سمت سرور با Safelist ریلکس پاکسازی شده) -->
        <div class="content" th:utext="${article.contentHtml}"></div>

        <!-- خوشه‌ی محتوایی: لینک‌های خودکار به مقالات هم‌خوشه -->
        <div th:if="${relatedArticles != null and !relatedArticles.isEmpty()}"
             style="margin-top:28px; border:1px solid #dbe4f0; border-radius:12px; padding:18px; background:#fafbfe;">
            <div style="font-weight:800; margin-bottom:12px;">
                📚 مقالات مرتبط در
                <a th:href="${baseUrl + '/blog/hub/' + article.hubSlug}" th:text="'«' + ${article.hub} + '»'"
                   style="color:var(--primary);">خوشه</a>
            </div>
            <ul style="margin:0 18px 0 0; line-height:2.2;">
                <li th:each="r : ${relatedArticles}">
                    <a th:href="${baseUrl + '/blog/' + (r.slug != null and !r.slug.isEmpty() ? r.slug : r.id)}"
                       th:text="${r.title}" style="color:var(--primary); text-decoration:none;">مقاله مرتبط</a>
                </li>
            </ul>
        </div>

        <div class="cta">
            <div style="font-weight:700;">نیاز به تجهیزات میکروتیک و شبکه دارید؟</div>
            <a th:href="${baseUrl + '/shop'}">مشاهده فروشگاه داده نما</a>
        </div>
    </article>
</main>

<footer th:if="${footerCategories != null and !footerCategories.isEmpty()}">
    <div class="in">
        <div style="font-weight:bold; color:#fff;">دسته‌بندی‌های فروشگاه</div>
        <nav>
            <a th:each="fc : ${footerCategories}"
               th:href="${baseUrl + '/shop/category/' + (fc.slug != null and !fc.slug.isEmpty() ? fc.slug : fc.id)}"
               th:text="${fc.name}">دسته</a>
        </nav>
        <div style="margin-top:16px; font-size:.75rem; color:#94a3b8;">© فروشگاه داده نما</div>
    </div>
</footer>
<!-- حبابِ چتِ پشتیبانی — هستهٔ مشترک با پنلِ کارشناس (/js/chat-core.js) -->
<script src="/js/chat-core.js"></script>
<script src="/js/support-chat-widget.js"></script>
</body>
</html>
