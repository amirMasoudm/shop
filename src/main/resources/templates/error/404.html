<!DOCTYPE html>
<html lang="fa" dir="rtl" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>صفحه پیدا نشد | داده نما</title>
    <!-- ⚠️ noindex در هدرِ HTTP هم ست می‌شود (LegacyPathErrorController)؛ این‌جا فقط
         بیمهٔ دوم است برای خزنده‌ای که هدر را نادیده بگیرد. -->
    <meta name="robots" content="noindex, follow">
    <link rel="icon" href="/favicon.ico" sizes="any">
    <link href="/css/fonts/Vazirmatn-font-face.css" rel="stylesheet">
    <link href="/css/site-nav.css" rel="stylesheet">
    <style>
        :root { --primary:#1b4f8a; --accent:#e8861a; --text:#1f2937; --mid:#6b7280; --bg:#f6f8fb; }
        * { box-sizing:border-box; margin:0; }
        body { font-family:Vazirmatn, Tahoma, sans-serif; background:var(--bg); color:var(--text); }
        .topbar { background:var(--primary); color:#fff; padding:14px 16px; }
        .topbar .in { max-width:1100px; margin:0 auto; display:flex; justify-content:space-between; align-items:center; }
        .topbar a { color:#fff; text-decoration:none; font-weight:700; }

        main { max-width:760px; margin:0 auto; padding:56px 16px 40px; text-align:center; }
        .code { font-size:5rem; font-weight:900; color:var(--primary); line-height:1; letter-spacing:-.02em; }
        h1 { font-size:1.4rem; margin:14px 0 10px; line-height:1.7; }
        .sub { color:var(--mid); font-size:.95rem; line-height:2; max-width:52ch; margin:0 auto 30px; }

        /* جست‌وجو بهترین راهِ خروج است: کاربر معمولاً دنبالِ چیزِ مشخصی بوده */
        form.find { display:flex; gap:8px; max-width:440px; margin:0 auto 26px; }
        form.find input {
            flex:1; min-width:0; height:46px; padding:0 14px; font-family:inherit; font-size:.92rem;
            border:1px solid #cbd5e1; border-radius:8px 0 0 8px; outline:none; background:#fff; color:var(--text);
        }
        form.find input:focus { border-color:var(--primary); box-shadow:inset 0 0 0 1px var(--primary); }
        form.find button {
            height:46px; padding:0 22px; border:none; border-radius:0 8px 8px 0; cursor:pointer;
            background:var(--primary); color:#fff; font-family:inherit; font-weight:700; font-size:.9rem;
        }
        form.find button:hover { background:#16406f; }

        .ways { display:flex; flex-wrap:wrap; gap:10px; justify-content:center; }
        .ways a {
            display:inline-block; padding:10px 22px; border-radius:100px; text-decoration:none;
            font-weight:700; font-size:.88rem; border:1px solid #dbe5f1; background:#fff; color:var(--primary);
        }
        .ways a.main { background:var(--accent); border-color:var(--accent); color:#fff; }
        .ways a:hover { border-color:var(--primary); }

        footer { background:#1b2a3a; color:#94a3b8; padding:24px 16px; margin-top:52px; text-align:center; font-size:.78rem; }

        @media (max-width:520px) {
            main { padding-top:38px; }
            .code { font-size:3.6rem; }
            h1 { font-size:1.15rem; }
            form.find { flex-direction:column; }
            form.find input { border-radius:8px; }
            form.find button { border-radius:8px; }
        }
    </style>
</head>
<body>

<header class="topnav">
    <a class="brand" href="/">داده نما</a>
    <nav>
        <a href="/wimaxnear">WimaxNear</a>
        <a href="/shop">فروشگاه</a>
        <a href="/learn">آموزش</a>
        <a href="/blog">بلاگ</a>
    </nav>
    <div class="spacer"></div>
</header>

<header class="topbar">
    <div class="in">
        <a href="/shop">🛒 فروشگاه داده نما</a>
        <span style="font-size:.85rem;">شبکه و ارتباطات</span>
    </div>
</header>

<main>
    <div class="code">۴۰۴</div>
    <h1>این صفحه پیدا نشد</h1>
    <p class="sub">
        ممکن است آدرس عوض شده باشد یا صفحه برداشته شده باشد. چیزی که دنبالش بودید
        احتمالاً هنوز روی سایت هست — از این‌جا پیدایش کنید.
    </p>

    <!-- جست‌وجوی فروشگاه: همان پارامتری که خودِ /shop می‌خواند -->
    <form class="find" action="/shop" method="get" role="search">
        <input type="search" name="q" placeholder="نامِ محصول یا موضوع…" aria-label="جست‌وجو در سایت">
        <button type="submit">جست‌وجو</button>
    </form>

    <div class="ways">
        <a class="main" href="/shop">فروشگاه</a>
        <a href="/blog">بلاگ آموزشی</a>
        <a href="/learn">دوره‌های آموزشی</a>
    </div>
</main>

<footer>© داده نما</footer>

</body>
</html>
