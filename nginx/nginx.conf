# ============================================================================
# 🔴 این فایلِ زندهٔ پراد است. کامپوز همین را مانت می‌کند:
#     ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
#
# در ۲۰۲۶-۰۹-۲۳ تأیید شد که محتوای این فایل بایت‌به‌بایت همان چیزی است که روی
# سرور اجرا می‌شود. پیش از آن، این محتوا زیرِ نامِ `nginx-tls.conf.pending`
# نگه داشته می‌شد و فایلِ `nginx.conf` نسخهٔ کهنهٔ پیش از TLS بود — یعنی هرکس
# «برای هماهنگ‌سازی» nginx.conf را روی سرور می‌فرستاد، TLS را می‌کشت. آن تلهٔ
# نام‌گذاری با همین کامیت بسته شد.
#
# ⚠️ بلاک‌های ۴۴۳ به `/etc/letsencrypt/live/dadehnama.com/` ارجاع می‌دهند. اگر
# روزی گواهی پاک شود، nginx بالا نمی‌آید و در حلقهٔ ری‌استارت می‌افتد — یک‌بار
# روی لوکال همین اتفاق افتاد و سایت خوابید. پس پیش از هر تغییرِ گواهی، اول
# `nginx -t` بعد ریلود.
# ============================================================================

upstream backend_app {
    server backend:8080;
    keepalive 32;
}

# ============================================================
# لاگِ جدا برای Hostهای ناشناس
#
# `shazdehkoucholo.ir` را فقط به این دلیل فهمیدیم که مالک تصادفی در نتایجِ
# گوگل دیدش. ممکن است دامنهٔ دیگری هم رکوردِ A اش را به آی‌پیِ ما زده باشد و
# ما خبر نداشته باشیم. این فرمت نامِ Host را ثبت می‌کند تا کشف جای تصادف را
# بگیرد:
#     docker exec shop_nginx awk '{print $1}' /var/log/nginx/unknown_host.log \
#       | sort | uniq -c | sort -rn
#
# این هیچ دری را باز نمی‌کند — فقط آنچه را که به هر حال رد می‌شود دیده‌شدنی
# می‌کند. `log_format` عمداً اینجاست چون باید در کانتکستِ http باشد و این فایل
# از داخلِ conf.d در http گنجانده می‌شود.
# ============================================================
log_format unknown_host '$host $remote_addr [$time_local] "$request" $status';

# ============================================================
# 🔒 قفلِ Host روی پورتِ ۸۰ — همان منطقِ کانفیگِ فعلی
#
# تنها تفاوت با نسخهٔ بدونِ TLS: مسیرِ چالشِ ACME باز است. بدونِ آن، تمدیدِ
# خودکارِ گواهی با HTTP-01 شکست می‌خورد چون certbot فایلِ چالش را روی همین
# پورت می‌جوید و اگر Host غیرمنتظره باشد به ۴۴۴ می‌خورد.
# ============================================================
server {
    listen 80 default_server;
    server_name _;

    access_log /var/log/nginx/unknown_host.log unknown_host;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    location / {
        return 444;
    }
}

# ============================================================
# 🔒 قفلِ Host روی پورتِ ۴۴۳
#
# بدونِ این بلاک، هر SNIِ ناشناسی به اولین بلاکِ ۴۴۳ می‌افتد و دوباره همان
# کلونِ خودمعرفِ `shazdehkoucholo.ir` ممکن می‌شود، این‌بار روی HTTPS.
# گواهی اینجا فقط برای این است که دستِ‌دادنِ TLS تمام شود تا بتوانیم ببندیم.
# ============================================================
server {
    listen 443 ssl default_server;
    http2 on;
    server_name _;

    ssl_certificate     /etc/letsencrypt/live/dadehnama.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dadehnama.com/privkey.pem;

    return 444;
}

# ============================================================
# HTTP روی نام‌های دامنه → ۳۰۱ به HTTPSِ canonical
#
# ⚠️ عمداً فقط چهار نامِ dadehnama اینجا هستند، نه آی‌پی و نه localhost.
# اگر آی‌پی هم ریدایرکت شود، `http://185.239.3.236` می‌رود به
# `https://185.239.3.236` و چون گواهی برای دامنه است نه آی‌پی، خطای گواهی
# می‌گیرد — یعنی تا پیش از سوییچِ DNS تنها راهِ دسترسیِ ما از بین می‌رود.
# ============================================================
server {
    listen 80;
    server_name dadehnama.com www.dadehnama.com dadehnama.ir www.dadehnama.ir;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    location / {
        return 301 https://dadehnama.com$request_uri;
    }
}

# ============================================================
# 🧹 خارج‌کردنِ دامنهٔ بیگانه از ایندکسِ گوگل — ۲۰۲۶-۰۹-۲۳
#
# `shazdehkoucholo.ir` رکوردِ A اش به آی‌پیِ ماست (دستِ ما نیست). پیش از قفلِ
# ۲۲ مرداد، nginx هر Host را جواب می‌داد و گوگل ۹ صفحهٔ ما را زیرِ آن نام
# ایندکس کرد — با عنوان و فاوآیکنِ خودمان.
#
# ⚠️ چرا `return 444` کافی نبود و این بلاک لازم است:
# ۴۴۴ اتصال را بی‌هیچ پاسخِ HTTP می‌بندد. خزنده آن را «سرور در دسترس نیست»
# می‌خواند، یعنی خطای *موقت* — پس ردیفِ ایندکس‌شده را نگه می‌دارد و بعداً باز
# تلاش می‌کند. قفل خون‌ریزی را بند آورد ولی همان ۹ صفحه را در جا فریز کرد.
# برای حذف، گوگل باید پاسخِ HTTPِ واقعی بگیرد: 404 یا 410 یا 301.
#
# چرا ۳۰۱ و نه ۴۱۰: محتوای آن صفحه‌ها از اول مالِ ما بود، پس ۳۰۱ صادقانه است؛
# هم از ایندکس درمی‌آورد، هم اگر انسانی روی نتیجه کلیک کرد به صفحهٔ واقعی
# می‌رسد نه به خطا.
#
# 🔴 فقط پورتِ ۸۰. برای این نام بلاکِ ۴۴۳ ساخته نمی‌شود: گواهیِ ما فقط برای
# dadehnama صادر شده و گواهیِ نامتناسب باعث می‌شود خزنده پاسخ را اصلاً نخواند.
# هر ۹ آدرسِ ایندکس‌شده هم `http://` هستند. بلاکِ `443 ssl default_server` با
# `return 444` باید دست‌نخورده بماند.
#
# 🔴 رکوردِ A این دامنه نباید زود برداشته شود: نبودِ DNS هم مثلِ ۴۴۴ خطای موقت
# است و دوباره فریز می‌کند. اول بگذار خزنده ۳۰۱ را بگیرد، بعد از صفرشدنِ
# `site:shazdehkoucholo.ir` سراغِ DNS برو.
# ============================================================
server {
    listen 80;
    server_name shazdehkoucholo.ir www.shazdehkoucholo.ir;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    location / {
        return 301 https://dadehnama.com$request_uri;
    }
}

# ============================================================
# HTTP روی آی‌پی و شبکهٔ محلی — بدونِ ریدایرکت، مثلِ امروز
#
# این بلاک بعد از سوییچِ DNS هم می‌ماند: هم برای تستِ داخلی لازم است، هم
# مالک با آی‌پیِ وای‌فای از موبایل تست می‌کند. رجکس به‌جای آی‌پیِ ثابت نوشته
# شده چون آی‌پیِ وای‌فای با هر تمدیدِ DHCP عوض می‌شود.
# ============================================================
server {
    listen 80;
    server_name localhost 185.239.3.236
                "~^(127\.|10\.|192\.168\.|172\.(1[6-9]|2[0-9]|3[01])\.)[0-9.]+$";

    client_max_body_size 20M;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/json
        application/xml
        application/rss+xml
        image/svg+xml
        image/bmp
        image/x-icon;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    location ~ ^/uploads/\. {
        deny all;
        access_log off;
        return 404;
    }

    location /uploads/ {
        proxy_pass http://backend_app;

        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_hide_header Cache-Control;
        proxy_hide_header Pragma;
        proxy_hide_header Expires;
        add_header Cache-Control "public, max-age=2592000, immutable" always;
    }

    location /ws/ {
        proxy_pass http://backend_app;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location / {
        proxy_pass http://backend_app;

        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# ============================================================
# HTTPS روی نام‌های غیرcanonical → ۳۰۱ به dadehnama.com
#
# دلیل: canonical در اپ از هدرِ Host ساخته می‌شود. اگر گوگل هم www ببیند هم
# بدونِ www، سیگنالِ سئو دو تکه می‌شود. dadehnama.ir هم CNAME به .com است و
# با سوییچِ رکوردِ A خودکار به همین سرور می‌رسد، پس باید جواب داشته باشد.
# ============================================================
server {
    listen 443 ssl;
    http2 on;
    server_name www.dadehnama.com dadehnama.ir www.dadehnama.ir;

    ssl_certificate     /etc/letsencrypt/live/dadehnama.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dadehnama.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    return 301 https://dadehnama.com$request_uri;
}

# ============================================================
# HTTPS روی دامنهٔ اصلی — جایی که سایت واقعاً سرو می‌شود
# ============================================================
server {
    listen 443 ssl;
    http2 on;
    server_name dadehnama.com;

    ssl_certificate     /etc/letsencrypt/live/dadehnama.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dadehnama.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # HSTS عمداً خاموش است. با max-age طولانی، اگر مشکلی پیش بیاید مرورگرها تا
    # زمانِ انقضا اجباری https می‌روند و برگشت عملاً ناممکن می‌شود. بعد از چند
    # روزِ پایدار با مقدارِ کوتاه شروع شود.
    # add_header Strict-Transport-Security "max-age=300" always;

    client_max_body_size 20M;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/json
        application/xml
        application/rss+xml
        image/svg+xml
        image/bmp
        image/x-icon;

    # 🔴 هر فایلِ نقطه‌دار زیرِ /uploads/ مسدود است — ۳۰ اوت یک فایلِ .env واقعی
    # از همین مسیر با کدِ ۲۰۰ روی سرورِ زنده سرو می‌شد.
    location ~ ^/uploads/\. {
        deny all;
        access_log off;
        return 404;
    }

    location /uploads/ {
        proxy_pass http://backend_app;

        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_hide_header Cache-Control;
        proxy_hide_header Pragma;
        proxy_hide_header Expires;
        add_header Cache-Control "public, max-age=2592000, immutable" always;
    }

    # ⚠️ وب‌سوکت نمی‌تواند به `location /` سپرده شود: آنجا عمداً `Connection ""`
    # گذاشته می‌شود (لازمهٔ keepalive) و همان مقدار هدرِ ارتقا را خنثی می‌کند.
    location /ws/ {
        proxy_pass http://backend_app;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location / {
        proxy_pass http://backend_app;

        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # اینجا X-Forwarded-Proto مقدارِ https می‌گیرد و چون
        # server.forward-headers-strategy روی framework است، getScheme() هم
        # https برمی‌گرداند — یعنی canonical و og:url و sitemap درست می‌شوند.
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
