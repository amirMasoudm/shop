# در داکر، کانتینر اسپرینگ‌بوت با نام backend شناخته می‌شود
upstream backend_app {
    server backend:8080;

    # نگه‌داشتن کانکشن‌های باز به بک‌اند و استفاده مجدد از آن‌ها
    keepalive 32;
}

server {
    listen 80;
    server_name localhost;

    # حداکثر حجم فایل آپلودی
    client_max_body_size 20M;

    # فشرده‌سازی پاسخ‌های متنی.
    # JPEG/PNG/WebP عمداً اینجا نیستند: خودشان فشرده‌اند و gzip رویشان
    # فقط CPU می‌سوزاند. فقط فرمت‌های تصویریِ متن‌محور یا فشرده‌نشده اضافه شده‌اند.
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/json
        application/xml
        application/rss+xml
        image/svg+xml
        image/bmp
        image/x-icon;

    # عکس‌های آپلودی: نامشان UUID است و محتوایشان هرگز عوض نمی‌شود
    # (عکس جدید = نام جدید)، پس کشِ بلندمدت کاملاً امن است.
    # proxy_hide_header لازم است چون Spring Security پیش‌فرض no-store می‌فرستد.
    location /uploads/ {
        proxy_pass http://backend_app;

        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_hide_header Cache-Control;
        proxy_hide_header Pragma;
        proxy_hide_header Expires;
        add_header Cache-Control "public, max-age=2592000, immutable" always;
    }

    location / {
        proxy_pass http://backend_app;

        # لازمهٔ keepalive: HTTP/1.1 و خالی‌گذاشتن هدر Connection
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # ارسال هدرهای مهم برای امنیت و شناسایی IP کلاینت
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}