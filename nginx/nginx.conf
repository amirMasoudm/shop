# در داکر، کانتینر اسپرینگ‌بوت با نام backend شناخته می‌شود
upstream backend_app {
    server backend:8080;

    # نگه‌داشتن کانکشن‌های باز به بک‌اند و استفاده مجدد از آن‌ها
    keepalive 32;
}

# ===========================================================================
# دامنهٔ canonical: https://dadehnama.com (بدونِ www)
#
# هر چیزِ دیگری — www، دامنهٔ .ir، و نسخهٔ HTTP — با ۳۰۱ به همان می‌رود.
# دلیل: canonical در اپ از هدرِ Host ساخته می‌شود؛ اگر گوگل هم www ببیند هم
# بدونِ www، سیگنالِ سئو دو تکه می‌شود.
#
# dadehnama.ir یک CNAME به dadehnama.com است، پس با سوییچِ رکوردِ A خودکار به
# همین سرور می‌رسد — انتخابی در کار نیست و گواهی باید هر چهار نام را بپوشاند.
# ===========================================================================

# --- HTTP: چالشِ ACME + ریدایرکت به HTTPSِ canonical ---
server {
    listen 80;
    server_name dadehnama.com www.dadehnama.com dadehnama.ir www.dadehnama.ir;

    # چالشِ Let's Encrypt نباید ریدایرکت شود وگرنه تمدیدِ webroot می‌شکند.
    # ^~ یعنی اگر این پیشوند مچ شد، دیگر دنبال regex نگرد.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    location / {
        return 301 https://dadehnama.com$request_uri;
    }
}

# --- HTTPS: هر نامی جز dadehnama.com → ۳۰۱ به canonical ---
server {
    listen 443 ssl;
    http2 on;
    server_name www.dadehnama.com dadehnama.ir www.dadehnama.ir;

    # همان گواهی؛ هر چهار نام در یک certificate هستند
    ssl_certificate     /etc/letsencrypt/live/dadehnama.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dadehnama.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    return 301 https://dadehnama.com$request_uri;
}

# --- HTTPS: دامنهٔ اصلی، جایی که سایت واقعاً سرو می‌شود ---
server {
    listen 443 ssl;
    http2 on;
    server_name dadehnama.com;

    ssl_certificate     /etc/letsencrypt/live/dadehnama.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dadehnama.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # HSTS عمداً فعال نشده. با max-age طولانی اگر مشکلی پیش بیاید برگشت عملاً
    # ناممکن می‌شود (مرورگرها تا انقضا اجباری https می‌روند). بعد از چند روز
    # پایداری با max-age کوتاه شروع و بعد بلند شود.
    # add_header Strict-Transport-Security "max-age=300" always;

    client_max_body_size 20M;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/json
        application/xml
        application/rss+xml
        image/svg+xml
        image/bmp
        image/x-icon;

    # عکس‌های آپلودی: نامشان UUID است و محتوایشان هرگز عوض نمی‌شود
    # (عکس جدید = نام جدید)، پس کشِ بلندمدت کاملاً امن است.
    # proxy_hide_header لازم است چون Spring Security پیش‌فرض no-store می‌فرستد.
    location /uploads/ {
        proxy_pass http://backend_app;

        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_hide_header Cache-Control;
        proxy_hide_header Pragma;
        proxy_hide_header Expires;
        add_header Cache-Control "public, max-age=2592000, immutable" always;
    }

    location / {
        proxy_pass http://backend_app;

        # لازمهٔ keepalive: HTTP/1.1 و خالی‌گذاشتن هدر Connection
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # X-Forwarded-Proto اینجا https می‌شود و چون
        # server.forward-headers-strategy=framework ست است، getScheme() هم
        # https برمی‌گرداند — یعنی canonical/og:url/sitemap درست می‌شوند.
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# --- HTTP روی آی‌پی (یا هر Host ناشناخته): بدونِ ریدایرکت ---
# تا پیش از سوییچِ DNS تنها راهِ دسترسی به سایت http://<ip> است و ریدایرکت به
# https://<ip> خطای گواهی می‌دهد. بعد از سوییچ می‌توان این بلوک را حذف کرد.
server {
    listen 80 default_server;
    server_name _;

    client_max_body_size 20M;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/json
        application/xml
        application/rss+xml
        image/svg+xml
        image/bmp
        image/x-icon;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    location /uploads/ {
        proxy_pass http://backend_app;

        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_hide_header Cache-Control;
        proxy_hide_header Pragma;
        proxy_hide_header Expires;
        add_header Cache-Control "public, max-age=2592000, immutable" always;
    }

    location / {
        proxy_pass http://backend_app;

        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
