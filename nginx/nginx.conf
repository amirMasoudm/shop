# در داکر، کانتینر اسپرینگ‌بوت با نام backend شناخته می‌شود
upstream backend_app {
    server backend:8080;

    # نگه‌داشتن کانکشن‌های باز به بک‌اند و استفاده مجدد از آن‌ها
    keepalive 32;
}

# ============================================================
# 🔒 قفلِ Host — روی پراد اعمال شد در ۲۰۲۶-۰۸-۲۲
#
# ⛔ این بلاک را حذف نکنید و وسوسهٔ «تمیزکاری» نشوید.
#
# چرا هست:
# تا پیش از این، بلاکِ سایت تنها server blockِ روی پورتِ ۸۰ بود و به همین
# دلیل nginx خودکار آن را default_server می‌کرد — یعنی *هر* دامنه‌ای که
# رکوردِ A اش را به آی‌پیِ ما می‌زد، کلِ فروشگاه را زیرِ نامِ خودش می‌گرفت.
# این فرضی نیست؛ واقعاً اتفاق افتاد: دامنهٔ `shazdehkoucholo.ir` به سرورِ ما
# اشاره می‌کرد و کلِ سایت را با canonical و og:url و sitemapِ خودارجاع سرو
# می‌کرد — یک کلونِ کاملِ خودمعرف که می‌توانست باعث شود گوگل آن را «اصل» و
# دامنهٔ واقعیِ ما را «کپی» حساب کند.
#
# اگر برداشته شود چه می‌شود:
# همان وضعیت بی‌صدا برمی‌گردد. هیچ خطایی در لاگ نمی‌بینید و هیچ تستی قرمز
# نمی‌شود؛ فقط دوباره هر Host ای جواب می‌گیرد. علامتِ سلامت این است که یک
# Hostِ ناشناس اتصالِ بسته بگیرد (در curl خروجِ ۵۲).
#
# چرا ۴۴۴ و نه ۳۰۱/۴۰۴:
# ۴۴۴ کدِ غیراستانداردِ خودِ nginx است: اتصال بدونِ هیچ پاسخی بسته می‌شود —
# نه محتوا، نه ریدایرکت، نه حتی کدِ وضعیت. برای جلوگیری از ایندکس بهترین
# حالت است. ۳۰۱ فعلاً مقصدی ندارد (هنوز دامنهٔ رسمی وصل نیست) و ۴۰۴ هم
# خودش وجودِ سرویس را تأیید می‌کند و قابلِ ایندکس است.
#
# ⚠️⚠️ هشدار دربارهٔ `nginx-tls.conf.pending` (فایلِ بغلی، فعلاً غیرفعال):
# آن فایل هم یک بلاکِ `listen 80 default_server` دارد، ولی برخلافِ اینجا
# محتوا را به هر Hostِ ناشناسی **سرو می‌کند** (`proxy_pass` به بک‌اند).
# یعنی روزی که آن فایل فعال شود، **قفلِ Host بی‌صدا برداشته می‌شود.**
# پیش از فعال‌سازیِ TLS باید آن بلاک هم به `return 444` تبدیل شود — با این
# استثنا که `location ^~ /.well-known/acme-challenge/` باید باز بماند،
# وگرنه صدورِ گواهیِ certbot شکست می‌خورد.
# ============================================================
server {
    listen 80 default_server;
    server_name _;
    return 444;
}

server {
    listen 80;

    # فهرستِ سفیدِ Host — عیناً همان چیزی که روی پراد فعال است.
    # ⚠️ `localhost` و آی‌پی باید بمانند: آی‌پی فعلاً تنها راهِ دسترسیِ ماست
    #    و `localhost` برای محیطِ لوکال و تست‌های داخلی لازم است.
    # چهار نامِ dadehnama از قبل ثبت شده‌اند تا هنگامِ سوییچِ DNS و نیز هنگامِ
    # چالشِ HTTP-01 ی certbot نیازی به تغییرِ دوبارهٔ کانفیگ نباشد.
    # نکتهٔ لوکال: دسترسی با `http://localhost/` است؛ `127.0.0.1` عمداً در این
    # فهرست نیست تا کانفیگِ مخزن و پراد دقیقاً یکی بماند.
    #
    # 🛟 اگر ابزاری روی `127.0.0.1` خطای اتصال داد (در curl خروجِ ۵۲ =
    #    «Empty reply from server»، یا در مرورگر صفحهٔ خالی) **این باگ نیست**.
    #    علتش دقیقاً همین فهرستِ سفید است: `127.0.0.1` در آن نیست، پس درخواست
    #    به بلاکِ `return 444` بالا می‌خورد و اتصال بدونِ پاسخ بسته می‌شود.
    #    راهِ درست: با `http://localhost/` وارد شوید.
    #    ⚠️ دنبالِ خرابیِ داکر/پورت‌فوروارد نگردید — علامتِ آن مشکل فرق دارد:
    #    آنجا درخواست **اصلاً در لاگِ nginx ظاهر نمی‌شود**، ولی اینجا ظاهر می‌شود
    #    و با کدِ ۴۴۴ ثبت می‌گردد. یک `docker logs shop_nginx` این دو را از هم
    #    جدا می‌کند (این تشخیص یک‌بار وقتِ تیم را گرفت؛ تکرارش نکنیم).
    server_name localhost 185.239.3.236 dadehnama.com www.dadehnama.com dadehnama.ir www.dadehnama.ir;

    # حداکثر حجم فایل آپلودی
    client_max_body_size 20M;

    # فشرده‌سازی پاسخ‌های متنی.
    # JPEG/PNG/WebP عمداً اینجا نیستند: خودشان فشرده‌اند و gzip رویشان
    # فقط CPU می‌سوزاند. فقط فرمت‌های تصویریِ متن‌محور یا فشرده‌نشده اضافه شده‌اند.
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/json
        application/xml
        application/rss+xml
        image/svg+xml
        image/bmp
        image/x-icon;

    # عکس‌های آپلودی: نامشان UUID است و محتوایشان هرگز عوض نمی‌شود
    # (عکس جدید = نام جدید)، پس کشِ بلندمدت کاملاً امن است.
    # proxy_hide_header لازم است چون Spring Security پیش‌فرض no-store می‌فرستد.
    location /uploads/ {
        proxy_pass http://backend_app;

        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_hide_header Cache-Control;
        proxy_hide_header Pragma;
        proxy_hide_header Expires;
        add_header Cache-Control "public, max-age=2592000, immutable" always;
    }

    location / {
        proxy_pass http://backend_app;

        # لازمهٔ keepalive: HTTP/1.1 و خالی‌گذاشتن هدر Connection
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # ارسال هدرهای مهم برای امنیت و شناسایی IP کلاینت
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
