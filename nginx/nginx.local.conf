# ============================================================================
# 🏠 کانفیگِ داکرِ لوکال — فقط HTTP
#
# کدام فایل کجاست:
#   · nginx/nginx.conf        → پراد (185.239.3.236). بلاک‌های ۴۴۳ و گواهیِ
#                               Let's Encrypt دارد. روی لوکال بالا نمی‌آید.
#   · nginx/nginx.local.conf  → همین فایل. داکرِ لوکال. هیچ بلاکِ ۴۴۳ ندارد.
#
# چرا دو فایل: کامپوزِ مخزن این فایل را مانت می‌کند. اگر کانفیگِ پراد مانت شود،
# nginx به دنبالِ `/etc/letsencrypt/live/dadehnama.com/fullchain.pem` می‌گردد،
# پیدایش نمی‌کند و **اصلاً بالا نمی‌آید** — و چون `backend` هم پورتِ مستقیم
# نداشت، هیچ راهی به اپ نمی‌ماند. این یک‌بار اتفاق افتاد و کارِ بقیهٔ چت‌ها را
# خواباند.
#
# 📌 این فایل از روی همان کانفیگِ پراد ساخته شده و فقط چیزهای مخصوصِ پراد از آن
# برداشته شده: بلاک‌های ۴۴۳، ریدایرکتِ دامنه به HTTPS، و ریدایرکتِ دامنهٔ بیگانه.
# هر محافظی که پراد دارد اینجا هم هست: قفلِ Host، مسدودیِ فایل‌های نقطه‌دارِ
# uploads، بلاکِ وب‌سوکت، و فهرستِ سفیدِ لوپ‌بک و شبکهٔ خصوصی.
# هر تغییری در محافظ‌های پراد باید اینجا هم بیاید.
# ============================================================================

upstream backend_app {
    server backend:8080;
    keepalive 32;
}

log_format unknown_host '$host $remote_addr [$time_local] "$request" $status';

# ============================================================
# 🔒 قفلِ Host — همان منطقِ پراد
#
# روی لوکال شاید زیادی به‌نظر برسد، ولی عمداً نگه داشته شده تا رفتارِ لوکال و
# پراد یکی باشد؛ وگرنه باگی که فقط روی پراد ظاهر می‌شود اینجا دیده نمی‌شود.
# ============================================================
server {
    listen 80 default_server;
    server_name _;

    access_log /var/log/nginx/unknown_host.log unknown_host;

    location / {
        return 444;
    }
}

# ============================================================
# میزبان‌های مجازِ لوکال
#
# 🛟 اگر با Hostی خارج از این فهرست صفحهٔ سفید گرفتی (در curl خروجِ ۵۲) این باگ
# نیست — به بلاکِ `return 444` بالا خورده‌ای. علامتِ خرابیِ داکر فرق دارد: آنجا
# درخواست اصلاً در لاگِ nginx ظاهر نمی‌شود.
#
# رجکس به‌جای آی‌پیِ ثابت نوشته شده چون آی‌پیِ وای‌فایِ دستگاه با هر تمدیدِ DHCP
# عوض می‌شود و مالک با موبایل روی همان تست می‌کند.
# ============================================================
server {
    listen 80;
    server_name localhost
                "~^(127\.|10\.|192\.168\.|172\.(1[6-9]|2[0-9]|3[01])\.)[0-9.]+$";

    client_max_body_size 20M;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/json
        application/xml
        application/rss+xml
        image/svg+xml
        image/bmp
        image/x-icon;

    # 🔴 هر فایلِ نقطه‌دار زیرِ /uploads/ مسدود است — ۳۰ اوت یک فایلِ .env واقعی
    # از همین مسیر با کدِ ۲۰۰ روی سرورِ زنده سرو می‌شد.
    location ~ ^/uploads/\. {
        deny all;
        access_log off;
        return 404;
    }

    location /uploads/ {
        proxy_pass http://backend_app;

        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_hide_header Cache-Control;
        proxy_hide_header Pragma;
        proxy_hide_header Expires;
        add_header Cache-Control "public, max-age=2592000, immutable" always;
    }

    # ⚠️ وب‌سوکت نمی‌تواند به `location /` سپرده شود: آنجا عمداً `Connection ""`
    # گذاشته می‌شود (لازمهٔ keepalive) و همان مقدار هدرِ ارتقا را خنثی می‌کند.
    # علامتش این است که هندشیک به‌جای ۱۰۱ کدِ ۲۰۰ یا ۴۰۰ می‌گیرد و چت بی‌هیچ
    # خطای واضحی «زنده» نمی‌شود.
    location /ws/ {
        proxy_pass http://backend_app;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location / {
        proxy_pass http://backend_app;

        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
